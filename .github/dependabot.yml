version: 2
updates:
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
    ignore:
      # Distribution upgrades need a deliberate LTS/package compatibility review.
      # Digest updates within Ubuntu 24.04 remain enabled.
      - dependency-name: ubuntu
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker-compose
    directory: /blueprints/dokploy-actions-runner
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
