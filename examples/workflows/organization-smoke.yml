name: Organization runner smoke test
on:
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    runs-on:
      group: trusted-builds
      labels: [self-hosted, linux, dokploy, org-ci]
    timeout-minutes: 5
    steps:
      - name: Verify group and label routing
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test ! -S /var/run/docker.sock
          test -z "${ACCESS_TOKEN:-}"
          printf 'Runner: %s\nArchitecture: %s\n' "$RUNNER_NAME" "$RUNNER_ARCH"
          git --version
