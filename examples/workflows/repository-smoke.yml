name: Repository runner smoke test
on:
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    runs-on: [self-hosted, linux, dokploy, repo-ci]
    timeout-minutes: 5
    steps:
      - name: Verify the runner without Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test ! -S /var/run/docker.sock
          test -z "${ACCESS_TOKEN:-}"
          printf 'Runner: %s\nArchitecture: %s\n' "$RUNNER_NAME" "$RUNNER_ARCH"
          git --version
          python3 --version
